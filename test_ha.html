<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Test de Home Assistant · Domótica 2MT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f1; --card:#ffffff; --ink:#1d2320; --muted:#5d6862; --line:#d9e0d4;
  --green:#4e8a1e; --green-soft:#e6f2da; --red:#c0392b; --red-soft:#fbe4e1;
  --ok:#2e7d32; --ok-soft:#e3f3e4; --yellow:#b7860b; --yellow-soft:#fdf5dc;
  --blue:#1f5fbf; --btn:#eef2ea; --on-green:#fff; --shadow:0 1px 3px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#141816; --card:#1e2420; --ink:#e7ece8; --muted:#a3ada6; --line:#34403a;
  --green:#8bc34a; --green-soft:#24331b; --red:#ef6b5d; --red-soft:#3a201d;
  --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
  --blue:#7aa7f0; --btn:#262e29; --on-green:#10200a; --shadow:0 1px 3px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --card:#1e2420; --ink:#e7ece8; --muted:#a3ada6; --line:#34403a;
    --green:#8bc34a; --green-soft:#24331b; --red:#ef6b5d; --red-soft:#3a201d;
    --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
    --blue:#7aa7f0; --btn:#262e29; --on-green:#10200a; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:17px;line-height:1.45}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--green);position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}
.back{border:1px solid var(--line);background:var(--btn);color:var(--ink);padding:6px 12px;border-radius:8px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.back:hover{border-color:var(--green)}
.crumbs{font-size:14px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--green);text-decoration:none}
.crumbs b{color:var(--ink)}
.theme{border:1px solid var(--line);background:var(--btn);color:var(--ink);width:38px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:26px;margin:6px 0 2px;font-weight:700}
h1 span{color:var(--green)}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.box{border-left:5px solid var(--green);background:var(--green-soft);border-radius:8px;padding:10px 14px;margin:12px 0}
.box .lbl{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--green);display:block;margin-bottom:2px}
.box.why{border-color:var(--yellow);background:var(--yellow-soft)}
.box.why .lbl{color:var(--yellow)}
fieldset{border:none;padding:0;margin:0 0 14px}
legend{font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip>span{display:inline-block;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--btn);cursor:pointer;font-size:15px;user-select:none}
.chip input:checked+span{border-color:var(--green);background:var(--green-soft);font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
.cnt{color:var(--muted);font-size:13px}
.go{background:var(--green);color:var(--on-green);border:none;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.go.ghost{background:var(--btn);color:var(--ink);border:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--btn)}
.tag.nq{font-weight:700;color:var(--ink);border-color:var(--green)}
.tag.d{border-color:var(--red);color:var(--red)}
.score{margin-left:auto;font-weight:700;color:var(--ink)}
.qtext{font-size:19px;font-weight:700;margin:6px 0 12px}
figure{margin:0 0 12px;text-align:center}
figure img{max-width:100%;max-height:520px;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line);cursor:zoom-in}
figcaption{font-size:14px;color:var(--muted);font-style:italic;margin-top:4px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--btn);font-weight:700;font-size:14px}
.opt:disabled{cursor:default}
.card.resume{border-left:5px solid var(--yellow);background:var(--yellow-soft)}
.pt{display:inline-block;min-width:1.5em;height:1.5em;line-height:calc(1.5em - 3px);padding:0 .12em;margin:0 .06em;border-radius:999px;background:#FFDD40;color:#111;border:1.5px solid #111;font-weight:700;font-size:.82em;text-align:center;vertical-align:.1em;font-style:normal}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.verdict{font-weight:700;font-size:18px;margin-top:12px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--red)}
.nav{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.big{font-size:44px;font-weight:700;color:var(--green);margin:0}
.review{border-top:1px solid var(--line);padding:12px 0}
.review .rq{font-weight:700}
.review .ra{color:var(--ok);font-weight:700}
.review .ry{color:var(--red)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.tw{overflow-x:auto;margin:0 0 6px}
.tt{border-collapse:collapse;margin:0 auto;font-size:15px;text-align:center}
.tt th,.tt td{border:1.5px solid var(--line);padding:6px 10px;min-width:44px}
.tt th{background:var(--green-soft);font-weight:700}
.tt td{font-weight:700;font-size:17px}
.tt td.qq{background:var(--yellow-soft);color:var(--yellow);border-color:var(--yellow)}
.cgrp{margin:0 0 10px}
.cgrp h3{font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:6px 0 6px}
.cbtns{display:flex;gap:8px;margin:0 0 8px}
.cbtns button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.jump{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:8px;margin:0 0 12px}
.jump>.go{padding:8px 14px;font-size:15px}
.jump>.go.ghost[aria-expanded=true]{border-color:var(--green);background:var(--green-soft)}
.qgrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:var(--shadow)}
.qgrid[hidden]{display:none}
.qgrid button{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);border-radius:8px;padding:7px 0;cursor:pointer}
.qgrid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qgrid button.ko{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.qgrid button.cur{outline:3px solid var(--green);outline-offset:1px}
.qgrid .leg{grid-column:1/-1;font-size:13px;color:var(--muted);margin:2px 0 0}
.qgrid .go.fin{grid-column:1/-1;margin-top:4px;color:var(--on-green);background:var(--green);border:none;padding:10px}
@media (max-width:480px){.jump{gap:6px}.jump .tx{display:none}.jump>.go{padding:8px 10px;font-size:14px}}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:16px}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px;padding:8px}
@media (max-width:560px){body{font-size:16px}.qtext{font-size:17px}h1{font-size:22px}.crumbs{font-size:12px}}

/* ---------- mapa de preguntas y marcador ---------- */
.qmap,.qbar,.qsheet{display:none}
.qmap h2{margin:0 0 8px;font-size:15px}
.qblk{margin:0 0 8px}.qblk>span{display:block;font-size:11px;color:var(--muted);margin:0 0 3px}
.qblk .g{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.qblk button{font:inherit;font-size:12px;font-weight:700;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);border-radius:6px;padding:5px 0;cursor:pointer}
.qblk button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qblk button.ko{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.qblk button.cur{outline:3px solid var(--green);outline-offset:1px}
.qmap .leg{font-size:11px;color:var(--muted);margin:6px 0 0}
.qmap .leg i{display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px solid var(--line);margin:0 3px 0 6px;vertical-align:-1px}
.qmap .leg i:first-child{margin-left:0}
.qmap .leg i.ok{background:var(--ok-soft);border-color:var(--ok)}.qmap .leg i.ko{background:var(--red-soft);border-color:var(--red)}
.sc{font-size:15px;margin:0 0 6px}.sc b{font-size:22px;margin-right:4px}.sc.ok b{color:var(--ok)}.sc.ko b{color:var(--red)}
.sc.nota{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.sc small{display:block;color:var(--muted);font-size:11px}
.qmap .fin,.qsheet .fin{width:100%;margin-top:8px;font-size:14px;padding:8px}
@media (min-width:1240px){
  body.inq .qmap{display:block;position:fixed;top:76px;max-height:calc(100vh - 92px);overflow:auto;width:min(230px,calc((100vw - 860px)/2 - 30px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
  body.inq .qmap.l{right:calc(50% + 444px)} body.inq .qmap.r{left:calc(50% + 444px)}
}
@media (max-width:1239px){
  body.inq .qbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));cursor:pointer;box-shadow:0 -4px 12px rgba(0,0,0,.15)}
  .qbar .segs{display:flex;gap:1px;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
  .qbar .segs i{flex:1;background:var(--btn)}.qbar .segs i.ok{background:var(--ok)}.qbar .segs i.ko{background:var(--red)}.qbar .segs i.cur{box-shadow:inset 0 0 0 2px var(--ink)}
  .qbar .tx{font-size:14px;font-weight:700;margin-top:4px;display:flex;gap:6px;align-items:center}.qbar .tx .ok{color:var(--ok)}.qbar .tx .ko{color:var(--red)}.qbar .more{margin-left:auto;color:var(--muted);font-weight:400}
  body.inq .qsheet{display:block;position:fixed;left:0;right:0;bottom:46px;max-height:62vh;overflow:auto;z-index:14;background:var(--card);border-top:1px solid var(--line);padding:10px 12px 14px;box-shadow:0 -6px 16px rgba(0,0,0,.25)}
  body.inq .qsheet[hidden]{display:none}
  .qsheet .qblk .g{grid-template-columns:repeat(10,1fr)}
  .qsheet .qblk button{padding:8px 0}
  body.inq main{padding-bottom:110px}
}
</style>

s": "c", "tema": "HA", "t": "Teoría · 4.2 Estados y atributos", "dif": "D", "tipo": "ENT", "q": "La persiana de la cocina está subiendo. ¿Qué estado tiene cover.p_cocina en ese momento?", "ok": "opening", "d": ["open", "on", "subiendo"], "j": "Los estados de una persiana son open, closed, opening y closing. Se guardan en inglés.", "img": null, "cap": "", "cat": ["estados"]}, {"n": 17, "ans": "b", "tema": "HA", "t": "Teoría · 4.2 Estados y atributos", "dif": "M", "tipo": "ENT", "q": "La interfaz te enseña «Encendida». ¿Cómo guarda HA ese estado por dentro?", "ok": "En inglés: on", "d": ["En español: encendida", "Con un número: 1", "Con el color de la luz"], "j": "Los estados se guardan en inglés (on, open, heat…), aunque la interfaz los enseñe en español. Importa al escribir automatizaciones y plantillas.", "img": null, "cap": "", "cat": ["estados"]}, {"n": 18, "ans": "d", "tema": "HA", "t": "Teoría · 4.3 Áreas y ayudantes", "dif": "M", "tipo": "CON", "q": "¿Para qué sirve un área?", "ok": "Para agrupar los dispositivos de una zona de la casa", "d": ["Para guardar copias de seguridad", "Para repartir los mensajes MQTT", "Para calcular un valor a partir de otras entidades con un pequeño texto entre llaves dobles"], "j": "Si asignas la persiana y el termostato de la cocina al área «Cocina», HA te los enseña juntos.", "img": null, "cap": "", "cat": ["piezas"]}, {"n": 19, "ans": "a", "tema": "HA", "t": "Teoría · 4.3 Áreas y ayudantes", "dif": "D", "tipo": "CON", "q": "Quieres un interruptor «modo vacaciones» que no es de ningún aparato, para usarlo en tus automatizaciones. ¿Qué creas?", "ok": "Un ayudante", "d": ["Una integración", "Un área", "Una copia de seguridad"], "j": "Un ayudante es una entidad que creas tú a mano para guardar un dato o hacer un cálculo.", "img": null, "cap": "", "cat": ["piezas"]}, {"n": 20, "ans": "b", "tema": "HA", "t": "Teoría · 4.4 Automatizaciones", "dif": "M", "tipo": "AUT", "q": "¿Cuáles son las tres partes de una automatización, en orden?", "ok": "Desencadenante, condición y acción", "d": ["Estado, atributo y entidad, que es lo que sale en la ficha de cada dispositivo", "Tema, carga útil y broker", "Dashboard, vista y tarjeta"], "j": "Algo la pone en marcha, se comprueba si se cumple lo que hace falta y se hace algo.", "img": null, "cap": "", "cat": ["auto"]}, {"n": 21, "ans": "b", "tema": "HA", "t": "Teoría · 4.4 Automatizaciones", "dif": "M", "tipo": "AUT", "q": "¿Qué parte de una automatización es opcional?", "ok": "La condición", "d": ["El desencadenante", "La acción", "Ninguna: las tres son obligatorias"], "j": "Sin desencadenante no arrancaría nunca y sin acción no haría nada.", "img": null, "cap": "", "cat": ["auto"]}, {"n": 22, "ans": "c", "tema": "HA", "t": "Teoría · 4.4 Automatizaciones", "dif": "M", "tipo": "AUT", "q": "Una automatización dice: «Cuando la potencia del frigorífico pase de 300 W, si la persiana de la cocina está abierta, enciende la tira RGB en rojo». ¿Cuál es el desencadenante?", "ok": "Que la potencia del frigorífico pase de 300 W", "d": ["Que la persiana de la cocina esté abierta en ese momento", "Encender la tira RGB en rojo", "Que la tira RGB esté apagada"], "j": "El desencadenante es lo que la pone en marcha. La persiana abierta es la condición y encender la tira es la acción.", "img": null, "cap": "", "cat": ["auto"]}, {"n": 23, "ans": "a", "tema": "HA", "t": "Teoría · 4.4 Automatizaciones", "dif": "M", "tipo": "AUT", "q": "Una automatización dice: «Cuando la potencia del frigorífico pase de 300 W, si la persiana de la cocina está abierta, enciende la tira RGB en rojo». ¿Cuál es la condición?", "ok": "Que la persiana de la cocina esté abierta", "d": ["Que la potencia del frigorífico pase de 300 W", "Encender la tira RGB en rojo", "No tiene condición"], "j": "La condición es lo que tiene que cumplirse para seguir. Va detrás de «si».", "img": null, "cap": "", "cat": ["auto"]}, {"n": 24, "ans": "a", "tema": "HA", "t": "Teoría · 4.4 Automatizaciones", "dif": "D", "tipo": "AUT", "q": "Una automatización dice: «Cuando la potencia del frigorífico pase de 300 W, si la persiana de la cocina está abierta, enciende la tira RGB en rojo». La persiana está cerrada y la potencia sube a 350 W. ¿Qué pasa?", "ok": "Nada: no se cumple la condición", "d": ["Se enciende la tira RGB en rojo", "Se abre la persiana y después se enciende la tira", "Se apaga el frigorífico"], "j": "El desencadenante se ha producido, pero la condición (persiana abierta) no se cumple: la automatización se queda ahí.", "img": null, "cap": "", "cat": ["auto"]}, {"n": 25, "ans": "b", "tema": "HA", "t": "Teoría · 4.5 Scripts y escenas", "dif": "M", "tipo": "AUT", "q": "¿Qué es un script?", "ok": "Una lista de acciones con nombre, sin desencadenante", "d": ["Una regla que se pone en marcha sola cuando pasa algo", "Una «foto» de cómo deben quedar varias entidades", "Un texto entre llaves dobles que calcula un valor"], "j": "Se lanza a mano (con un botón) o desde una automatización. Ejemplo: «Cerrar todo».", "img": null, "cap": "", "cat": ["auto"]}, {"n": 26, "ans": "a", "tema": "HA", "t": "Teoría · 4.5 Scripts y escenas", "dif": "M", "tipo": "AUT", "q": "¿Qué es una escena?", "ok": "Una «foto» de cómo deben quedar varias entidades, que se aplica de golpe", "d": ["Una lista de acciones que se hacen una detrás de otra, con esperas", "Una pestaña de un dashboard", "Una zona de la casa"], "j": "La escena solo dice cómo tiene que quedar todo. El script hace cosas una detrás de otra.", "img": null, "cap": "", "cat": ["auto"]}, {"n": 27, "ans": "b", "tema": "HA", "t": "Teoría · 4.5 Scripts y escenas", "dif": "D", "tipo": "AUT", "q": "«Un script se pone en marcha solo cuando pasa algo, igual que una automatización.» ¿Verdadero o falso?", "ok": "Falso: se lanza a mano o desde una automatización", "d": ["Verdadero: es otro nombre de la automatización", "Verdadero, pero solo a una hora fija", "Falso: un script no se puede poner en marcha de ninguna manera"], "j": "El script no tiene desencadenante. La que arranca sola es la automatización.", "img": null, "cap": "", "cat": ["auto"]}, {"n": 28, "ans": "c", "tema": "HA", "t": "Teoría · 4.5 Scripts y escenas", "dif": "D", "tipo": "AUT", "q": "Quieres «Cerrar todo»: bajar las tres persianas, esperar a que bajen, recoger el toldo y apagar las luces, al tocar un botón. ¿Qué usas?", "ok": "Un script", "d": ["Una escena", "Un área", "Una plantilla"], "j": "Son varias acciones una detrás de otra y con una espera: eso es un script. La escena no espera: solo dice cómo queda todo.", "img": null, "cap": "", "cat": ["auto"]}, {"n": 29, "ans": "a", "tema": "HA", "t": "Teoría · 4.6 Plantillas", "dif": "D", "tipo": "CON", "q": "En Home Assistant, ¿qué es una plantilla (template)?", "ok": "Un pequeño texto con código, entre llaves dobles, que calcula un valor", "d": ["Una máquina virtual apagada que sirve de molde para copiar las máquinas virtuales de los grupos", "Un dashboard ya hecho que se copia", "Una copia de seguridad"], "j": "No la confundas con la plantilla de VM de Proxmox (la VM apagada de la que se copiaron las vuestras). Misma palabra, dos cosas.", "img": null, "cap": "", "cat": ["piezas"]}, {"n": 30, "ans": "b", "tema": "HA", "t": "Teoría · 4.7 Dashboards y tarjetas", "dif": "M", "tipo": "CON", "q": "¿De qué está hecho un dashboard?", "ok": "De tarjetas", "d": ["De temas", "De integraciones", "De instantáneas"], "j": "Cada recuadro es una tarjeta: una persiana, un termostato, una gráfica, el tiempo…", "img": null, "cap": "", "cat": ["dash"]}, {"n": 31, "ans": "c", "tema": "HA", "t": "Teoría · 4.7 Dashboards y tarjetas", "dif": "M", "tipo": "CON", "q": "Dentro de un dashboard, ¿qué es una vista?", "ok": "Algo parecido a una pestaña, con sus propias tarjetas", "d": ["Una copia de seguridad del dashboard", "El modo de edición", "La lista de usuarios que pueden ver ese dashboard y cambiarlo"], "j": "Un dashboard puede tener varias vistas y cada vista tiene sus tarjetas.", "img": null, "cap": "", "cat": ["dash"]}, {"n": 32, "ans": "d", "tema": "HA", "t": "Teoría · 4.8 Historial y estadísticas", "dif": "D", "tipo": "CON", "q": "Por defecto, ¿cuánto tiempo guarda el historial el detalle de cada cambio de estado?", "ok": "Unos 10 días", "d": ["Unas 10 horas", "Un año", "Para siempre"], "j": "Lo que se guarda mucho más tiempo son las estadísticas: resúmenes (medias, máximos, totales por hora).", "img": null, "cap": "", "cat": ["piezas"]}, {"n": 33, "ans": "d", "tema": "HA", "t": "Teoría · 4.9 Panel de Energía", "dif": "M", "tipo": "ENT", "q": "¿Qué necesita el panel de Energía de cada aparato?", "ok": "Un sensor de energía, en kWh", "d": ["Un sensor de potencia, en W, como sensor.e_frigo_power", "Un sensor de tensión, en V", "Un sensor de temperatura"], "j": "El panel suma lo que se ha gastado: eso es energía (kWh), no potencia (W).", "img": null, "cap": "", "cat": ["energia"]}, {"n": 34, "ans": "b", "tema": "HA", "t": "Teoría · 4.9 Panel de Energía", "dif": "D", "tipo": "ENT", "q": "Para el frigorífico, ¿qué sensor le das al panel de Energía?", "ok": "sensor.e_frigo_summation_delivered", "d": ["sensor.e_frigo_power", "switch.e_frigo", "binary_sensor.ter_salon_valve"], "j": "summation_delivered va sumando lo gastado, en kWh. power es la potencia de ahora, en W.", "img": null, "cap": "", "cat": ["energia"]}, {"n": 35, "ans": "d", "tema": "HA", "t": "Teoría · 4.9 Panel de Energía", "dif": "M", "tipo": "ENT", "q": "¿Qué te dice sensor.e_frigo_power?", "ok": "Cuánto está gastando el frigorífico ahora, en W", "d": ["Cuánto ha gastado el frigorífico en total, en kWh", "Si el frigorífico está encendido o apagado", "A qué temperatura está el frigorífico por dentro"], "j": "Potencia no es energía: la potencia es lo de ahora (W) y la energía, lo gastado en total (kWh).", "img": null, "cap": "", "cat": ["energia"]}, {"n": 36, "ans": "a", "tema": "HA", "t": "Teoría · 4.10 Usuarios y permisos", "dif": "M", "tipo": "NOR", "q": "¿Cómo es el usuario de tu grupo (user1, user2…)?", "ok": "Administrador, y solo puede entrar desde la red local del aula", "d": ["Normal: solo puede usar la casa, sin cambiar ningún ajuste, y entra desde cualquier sitio", "Es el del profesor", "Es un usuario del sistema y no sirve para entrar"], "j": "Por ser administrador puedes cambiar los ajustes. Por eso hay normas: no cambiar contraseñas ni instalar nada sin permiso.", "img": null, "cap": "", "cat": ["usuarios"]}, {"n": 37, "ans": "c", "tema": "HA", "t": "Teoría · 4.10 Usuarios y permisos", "dif": "D", "tipo": "NOR", "q": "En tu VM hay un usuario llamado «puente». ¿Para qué sirve?", "ok": "Es un usuario del sistema para el MQTT; no sirve para entrar", "d": ["Es el usuario del profesor", "Es el usuario para entrar como invitado", "Es el usuario que tiene que usar el segundo alumno de cada grupo cuando el primero ya ha entrado"], "j": "Lo usan los puentes MQTT. No lo toques.", "img": null, "cap": "", "cat": ["usuarios"]}, {"n": 38, "ans": "a", "tema": "HA", "t": "Teoría · 4.11 Copias de seguridad", "dif": "D", "tipo": "NOR", "q": "Haces una copia de seguridad y la dejas guardada dentro de tu VM. Después, el profesor hace el reset. ¿Qué pasa con la copia?", "ok": "Se pierde con todo lo demás", "d": ["Se queda guardada: el reset no toca las copias", "Se restaura sola al arrancar", "Pasa al escaparate"], "j": "El reset devuelve la VM entera a la instantánea «limpio». Si quieres conservar algo, sácalo de la VM o haz capturas.", "img": null, "cap": "", "cat": ["reset"]}, {"n": 39, "ans": "b", "tema": "MQ", "t": "Teoría · 5. Publicar y suscribirse", "dif": "M", "tipo": "MQT", "q": "En MQTT, ¿cómo se mandan los mensajes los aparatos?", "ok": "No se hablan directamente: todo pasa por el broker", "d": ["Cada aparato habla directamente con todos los demás", "Por un cable serie de aparato a aparato", "A través de la nube del fabricante"], "j": "El broker es el servidor central: recibe los mensajes y los reparte. Hace de cartero.", "img": null, "cap": "", "cat": ["pubsub"]}, {"n": 40 ía · 6. Temas y comodines", "dif": "M", "tipo": "MQT", "q": "¿Por qué vale el comodín + en un tema?", "ok": "Por un nivel cualquiera, exactamente uno", "d": ["Por todos los niveles que sigan", "Por una letra cualquiera", "Por la carga útil"], "j": "Puede ir en medio: virtual/+/set recoge las órdenes a cualquier dispositivo virtual.", "img": "temas.png", "cap": "Teoría, figura 4: los temas forman un árbol; los comodines eligen ramas.", "cat": ["temas", "figuras"]}, {"n": 45, "ans": "b", "tema": "MQ", "t": "Teoría · 6. Temas y comodines", "dif": "M", "tipo": "MQT", "q": "¿Por qué vale el comodín # en un tema?", "ok": "Por todos los niveles que sigan; solo puede ir al final", "d": ["Por un solo nivel; puede ir en medio", "Por un número cualquiera", "Por el nombre del broker al que está conectado el cliente que se suscribe"], "j": "virtual/# recoge todo lo que empiece por virtual/, a cualquier nivel.", "img": "temas.png", "cap": "Teoría, figura 4: los temas forman un árbol; los comodines eligen ramas.", "cat": ["temas", "figuras"]}, {"n": 46, "ans": "d", "tema": "MQ", "t": "Teoría · 6. Temas y comodines", "dif": "D", "tipo": "MQT", "q": "Estás suscrito a virtual/+/set. ¿Recibes un mensaje publicado en virtual/ter_salon/set/current_heating_setpoint?", "ok": "No: tiene un nivel de más", "d": ["Sí: el + vale por todo lo que haga falta", "Sí, pero llega con retraso", "No, porque los termostatos no usan MQTT"], "j": "El + vale por un nivel exacto. Ese tema tiene un nivel más después de set.", "img": null, "cap": "", "cat": ["temas"]}, {"n": 47, "ans": "d", "tema": "MQ", "t": "Teoría · 6. Temas y comodines", "dif": "M", "tipo": "MQT", "q": "Quieres ver en «Escuchar un tema» todo lo que pasa en tu kit de dispositivos virtuales. ¿Qué tema escribes?", "ok": "virtual/#", "d": ["virtual/+", "zigbee2mqtt/#", "#/virtual"], "j": "virtual/+ solo recogería los temas de dos niveles. El # tiene que ir al final.", "img": null, "cap": "", "cat": ["temas"]}, {"n": 48, "ans": "a", "tema": "M a 3: las máquinas", "dif": "M", "tipo": "SER", "q": "¿Cuántos Home Assistant funcionan a la vez en el mini-PC del aula?", "ok": "Siete: uno por grupo y el escaparate", "d": ["Uno, que comparten todos los grupos", "Seis", "Trece"], "j": "Seis VMs de alumnos más la VM del escaparate. Trece son los dispositivos del kit.", "img": null, "cap": "", "cat": ["montaje"]}, {"n": 72, "ans": "d", "tema": "SRV", "t": "Nuestro servidor · 2. Capa 3: las máquinas", "dif": "D", "tipo": "SER", "q": "¿En qué se diferencia un contenedor de una máquina virtual?", "ok": "Es más ligero: comparte el núcleo del sistema del servidor", "d": ["Es más pesado: lleva dos sistemas operativos", "No se diferencia en nada", "No puede tener dirección de red"], "j": "El contenedor solo aísla los programas. Una VM es un ordenador «de mentira» completo.", "img": null, "cap": "", "cat": ["montaje"]}, {"n": 73, "ans": "c", "tema": "SRV", "t": "Nuestro servidor · 2. Capa 3: las máquinas", "dif": "M", "tipo": "SER", "q": "¿Qué hay dentro del contenedor del servidor?", "ok": "El Mosquitto común, el simulador de dispositivos y Zigbee2MQTT", "d": ["El Home Assistant del profesor, con las contraseñas de todos los grupos", "Las copias de seguridad de todos los grupos", "El escaparate"], "j": "Zigbee2MQTT está instalado, pero parado hasta que se conecte el coordinador (pendiente).", "img": null, "cap": "", "cat": ["montaje"]}, {"n": 74, "ans": "d", "tema": "SRV", "t": "Nuestro servidor · 1. Paso 2: crear la VM", "dif": "D", "tipo": "SER", "q": "Creas una máquina virtual para HAOS con el arranque antiguo (BIOS) en vez de UEFI. ¿Qué pasa?", "ok": "HAOS no arranca", "d": ["Arranca igual", "Arranca, pero sin red", "Arranca más despacio"], "j": "HAOS necesita firmware UEFI. En Proxmox se usa el llamado OVMF, sin Secure Boot.", "img": null, "cap": "", "cat": ["instalarvm"]}, {"n": 75, "ans": "b", "tema": "SRV", "t": "Nuestro servidor · 1. Paso 3: poner la imagen como disco", "dif": "D", "tipo": "SER", "q": "¿Cómo se pone HAOS en una máquina virtual?", "ok": "Se importa la imagen descargada como disco duro de la VM", "d": ["Se monta como un CD y se instala paso a paso, como Windows", "Se instala desde la tienda de apps", "Se copia a mano desde otra VM encendida"], "j": "La imagen ya trae todo instalado: ese disco ya es Home Assistant.", "img": null, "cap": "", "cat": ["instalarvm"]}, {"n": 76, "ans": "a", "tema": "SRV", "t": "Nuestro servidor · 1. Idea clave: ¿con :8123 o sin puerto?", "dif": "D", "tipo": "SER", "q": "En casi todos los tutoriales, Home Assistant se abre con :8123 al final de la dirección. ¿Y en nuestro servidor?", "ok": "Se entra sin puerto", "d": ["También con :8123", "Con :1883", "Con :8883, que es el puerto cifrado"], "j": "Los HAOS recién instalados con las versiones actuales se abren sin puerto. 1883 y 8883 son puertos de MQTT.", "img": null, "cap": "", "cat": ["instalarvm"]}, {"n": 77, "ans": "c", "tema": "SRV", "t": "Nuestro servidor · 2. Capa 3: las máquinas", "dif": "D", "tipo": "SER", "q": "La documentación oficial pide 2 GB de memoria para Home Assistant. ¿Por qué las VMs de alumnos tienen 1,5 GB?", "ok": "Para que quepan siete Home Assistant en los 16 GB del mini-PC", "d": ["Porque con menos memoria va más rápido", "Porque Proxmox no deja poner más", "Porque el kit de dispositivos virtuales no gasta memoria"], "j": "Es el precio de tener un HA propio para cada grupo en un solo mini-PC.", "img": null, "cap": "", "cat": ["montaje"]}, {"n": 78, "ans": "a", "tema": "SRV", "t": "Nuestro servidor · 2. Capa 3: las máquinas", "dif": "M", "tipo": "SER", "q": "En Proxmox, ¿qué es la plantilla del servidor?", "ok": "Una máquina virtual preparada y apagada que sirvió de molde para copiar las demás", "d": ["Un texto entre llaves dobles que calcula un valor a partir de otras entidades de Home Assistant", "El dashboard que viene hecho", "La copia de seguridad de cada grupo"], "j": "No la confundas con las plantillas (templates) de Home Assistant.", "img": null, "cap": "", "cat": ["montaje"]}, {"n": 79, "ans": "b", "tema": "SRV", "t": "Nuestro servidor · 2. Las dos redes", "dif": "D", "tipo": "SER", "q": "El servidor tiene una red interna, sin salida al exterior. ¿Para qué se usa?", "ok": "Para el MQTT entre las VMs de alumnos y el contenedor", "d": ["Para que entres desde los PCs del aula", "Para salir a internet", "Para conectar los aparatos Zigbee"], "j": "Por la otra red, la que va a la toma Ethernet, es por donde entras tú.", "img": null, "cap": "", "cat": ["montaje"]}, {"n": 80, "ans": "d", "tema": "SRV", "t": "Nuestro servidor · 2. El reset y la instantánea «limpio»", "dif": "M", "tipo": "NOR", "q": "¿Qué es una instantánea (snapshot)?", "ok": "Una «foto» del estado de una máquina virtual, a la que se puede volver", "d": ["Una captura de pantalla del dashboard", "Una copia de la máquina virtual guardada en otro ordenador del instituto", "Un mensaje MQTT retenido"], "j": "Cada VM de alumno tiene una llamada «limpio»: su estado de partida.", "img": null, "cap": "", "cat": ["reset"]}, {"n": 81, "ans": "a", "tema": "SRV", "t": "Nuestro servidor · 2. El reset y la instantánea «limpio»", "dif": "M", "tipo": "NOR", "q": "El profesor hace el reset. ¿Qué pierde tu grupo?", "ok": "Todo lo que haya hecho: dashboards, automatizaciones, ayudantes y dispositivos añadidos", "d": ["Nada", "Solo los dispositivos añadidos al kit; los dashboards y las automatizaciones se quedan como estaban", "Solo las automatizaciones"], "j": "No hay forma de recuperarlo. Antes de terminar, haz capturas o exporta lo que tengas que entregar.", "img": null, "cap": "", "cat": ["reset"]}, {"n": 82, "ans": "a", "tema": "SRV", "t": "Nuestro servidor · 2. El reset y la instantánea «limpio»", "dif": "D", "tipo": "NOR", "q": "¿Toca el reset al escaparate?", "ok": "No: solo devuelve a «limpio» las seis VMs de alumnos", "d": ["Sí: lo borra todo", "Sí, pero solo su histórico", "Solo si está encendido"], "j": "El escaparate y el contenedor no se tocan.", "img": null, "cap": "", "cat": ["reset"]}, {"n": 83, "ans": "b", "tema": "SRV", "t": "Nuestro servidor · 2. El reset y la instantánea «limpio»", "dif": "D", "tipo": "VIR", "q": "Después de un reset, ¿qué pasa con el kit de dispositivos virtuales?", "ok": "Vuelve solo, más o menos un minuto después", "d": ["Hay que añadir los 13 dispositivos a mano, uno por uno, publicando un mensaje para cada uno", "Desaparece para siempre", "Se queda como lo dejaste, con lo que añadiste"], "j": "Vuelve el kit de 13. Lo que hubieras añadido tú se pierde.", "img": null, "cap": "", "cat": ["reset", "kit"]}, {"n": 84, "ans": "d", "tema": "SRV", "t": "Nuestro servidor · 2. El escaparate", "dif": "M", "tipo": "SER", "q": "¿Qué es el escaparate?", "ok": "Un Home Assistant de ejemplo con los dashboards de una vivienda real", "d": ["El Home Assistant del grupo que mejor lo hace", "La pantalla de administración de Proxmox", "Una tienda de apps"], "j": "Es una foto fija para ver cómo queda una casa terminada: no maneja ningún aparato.", "img": null, "cap": "", "cat": ["montaje"]}, {"n": 85, "ans": "d", "tema": "SRV", "t": "Nuestro servidor · 3. El kit de cada grupo", "dif": "M", "tipo": "VIR", "q": "¿Con qué empieza cada grupo?", "ok": "Con un kit de 13 dispositivos virtuales y el «Virtual Bridge»", "d": ["Con un Home Assistant vacío, sin dispositivos: cada grupo los añade", "Con tres aparatos Zigbee reales", "Con 40 dispositivos virtuales"], "j": "El Virtual Bridge es un dispositivo especial que sirve para gestionar el kit. 40 es el máximo por grupo.", "img": null, "cap": "", "cat": ["kit"]}, {"n": 86, "ans": "b", "tema": "SRV", "t": "Nuestro servidor · 3. Cómo distinguirlos de los reales", "dif": "M", "tipo": "VIR", "q": "¿Cómo sabes que un dispositivo es virtual?", "ok": "En su ficha, el fabricante es «Virtual (aula)» y el modelo termina en «(virtual)»", "d": ["Porque su nombre empieza por aula_ y en la lista sale con un icono distinto al de los demás", "Porque no tiene entidades", "Porque no se puede poner en un dashboard"], "j": "Los que empezarán por aula_ son los reales (pendiente).", "img": null, "cap": "", "cat": ["kit"]}, {"n": 87, "ans": "d", "tema": "SRV", "t": "Nuestro servidor · 3. Altas, bajas y cambios de nombre", "dif": "D", "tipo": "ORD", "q": "Quieres añadir una persiana virtual nueva. ¿Qué publicas, y en qué orden?", "ok": "Primero permit_join y después device/add", "d": ["Solo device/add", "Primero device/add y después permit_join", "Primero kit/restablecer y después device/rename"], "j": "Como en una red Zigbee de verdad: primero se abre el emparejamiento. Sin él, el simulador rechaza la petición.", "img": null, "cap": "", "cat": ["kit", "ordenes"]}, {"n": 88, "ans": "b", "tema": "SRV", "t": "Nuestro servidor · 3. Límites del simulador", "dif": "D", "tipo": "ORD", "q": "¿Cuál de estos nombres vale para un dispositivo virtual nuevo?", "ok": "p_hab2", "d": ["P_Hab2", "persiana habitación 2", "p-hab2"], "j": "Solo minúsculas, números y guion bajo: nada de espacios, tildes, mayúsculas ni guiones normales.", "img": null, "cap": "", "cat": ["kit", "ordenes"]}, {"n": 89, "ans": "b", "tema": "SRV", "t": "Nuestro servidor · 3. Altas, bajas y cambios de nombre", "dif": "M", "tipo": "ORD", "q": "¿Dónde escribes en HA un tema y un mensaje MQTT para mandarlo?", "ok": "En Ajustes → Dispositivos y servicios → MQTT → Configurar → Publicar un paquete", "d": ["En Ajustes → Copias de seguridad", "En la app File editor, creando un archivo de texto con el tema y guardándolo en la carpeta de MQTT", "En la tarjeta del dispositivo"], "j": "En la misma pantalla está «Escuchar un tema», para ver las respuestas.", "img": null, "cap": "", "cat": ["kit", "ordenes"]}, {"n": 90, "ans": "d", "tema": "SRV", "t": "Nuestro servidor · 4. De virtual a real (pendiente)", "dif": "M", "tipo": "VIR", "q": "¿Cómo empezarán los nombres de los dispositivos reales del aula?", "ok": "Por aula_", "d": ["Por virtual_", "Por p_", "Por real_"], "j": "Por ejemplo, aula_persiana1 o aula_termostato. Todavía no funcionan: está pendiente.", "img": null, "cap": "", "cat": ["reales"]}, {"n": 91, "ans": "c", "tema": "SRV", "t": "Nuestro servidor · 4. Qué cambia y qué no para ti", "dif": "D", "tipo": "VIR", "q": "Cuando funcionen los dispositivos reales, tu automatización sube una persiana real. ¿Quién la ve subir?", "ok": "Toda la clase: los reales son compartidos por todos los grupos", "d": ["Solo tu grupo, porque cada grupo tiene sus propios dispositivos reales", "Nadie: es una prueba", "Solo el profesor"], "j": "Por eso conviene probar primero con tus virtuales y pasar a los reales cuando funcione.", "img": null, "cap": "", "cat": ["reales"]}, {"n": 92, "ans": "d", "tema": "SRV", "t": "Nuestro servidor · 4. Qué cambia y qué no para ti", "dif": "D", "tipo": "VIR", "q": "Para ti, en tu Home Assistant, ¿qué serán los dispositivos reales?", "ok": "Entidades MQTT, igual que los virtuales", "d": ["Entidades de una integración nueva que habrá que instalar en cada VM", "Dispositivos que solo se ven en el escaparate", "Apps"], "j": "Tu forma de trabajar no cambia: tarjetas, automatizaciones y scripts se hacen igual.", "img": null, "cap": "", "cat": ["reales"]}, {"n": 93, "ans": "c", "tema": "P1", "t": "Práctica 1 · Paso 2", "dif": "M", "tipo": "PRA", "q": "¿Por qué empieza el entity_id de una entidad del tiempo?", "ok": "Por weather.", "d": ["Por sensor.", "Por climate.", "Por light."], "j": "climate es un termostato; weather es el tiempo que hace.", "img": null, "cap": "", "cat": ["tiempo"]}, {"n": 94, "ans": "c", "tema": "P1", "t": "Práctica 1 · Paso 2", "dif": "M", "tipo": "PRA", "q": "¿Qué integración da el tiempo en la práctica?", "ok": "Met.no", "d": ["MQTT", "Mosquitto broker", "Zigbee2MQTT"], "j": "Es el instituto meteorológico de Noruega: gratis y sin registrarse.", "img": null, "cap": "", "cat": ["tiempo"]}, {"n": 95, "ans": "d", "tema": "P1", "t": "Práctica 1 · Paso 2", "dif": "D", "tipo": "PRA", "q": "¿Qué necesita la integración del tiempo para funcionar?", "ok": "Que la VM pueda salir a internet", "d": ["Un sensor de temperatura en el aula", "El coordinador Zigbee", "Una cuenta de pago"], "j": "Los datos del tiempo vienen de fuera. Desde el instituto las VMs sí pueden abrir páginas web.", "img": null, "cap": "", "cat": ["tiempo"]}, {"n": 96, "ans": "c", "tema": "P1", "t": "Práctica 1 · Pregunta 2", "dif": "D", "tipo": "PRA", "q": "No has escrito las coordenadas del instituto en ningún sitio. ¿De dónde saca HA la ubicación para el tiempo?", "ok": "De la ubicación de la casa que ya está puesta en Home Assistant", "d": ["De la dirección IP del ordenador", "Del GPS del móvil del primero que entra con el usuario del grupo", "Del nombre del dashboard"], "j": "La ubicación se pone en el asistente inicial y sirve para la hora, el tiempo y la salida del sol.", "img": null, "cap": "", "cat": ["tiempo"]}, {"n": 97, "ans": "d", "tema": "P1", "t": "Práctica 1 · Pregunta 3", "dif": "D", "tipo": "PRA", "q": "HA puede tener una entidad que da la hora, sensor.time, pero solo cambia una vez por minuto. ¿Sirve para un reloj con segundos?", "ok": "No: entre un cambio y otro no se movería", "d": ["Sí: cambia sola cada segundo", "Sí, si se pone en una tarjeta grande", "No, porque da la hora de otro país"], "j": "Un dato que cambia cada minuto no puede enseñar los segundos corriendo.", "img": null, "cap": "", "cat": ["reloj"]}, {"n": 98, "ans": "b", "tema": "P1", "t": "Práctica 1 · Paso 3", "dif": "M", "tipo": "PRA", "q": "¿Por qué se crea un dashboard nuevo en vez de cambiar el que ya viene hecho?", "ok": "Para no estropear el que ya viene hecho", "d": ["Porque el que viene hecho no se puede abrir", "Porque el que viene hecho es de otro grupo", "Porque cada tarjeta necesita su propio dashboard"], "j": "En el tuyo, vacío y con el nombre de tu grupo, puedes probar sin miedo.", "img": null, "cap": "", "cat": ["dash"]}, {"n": 99, "ans": "a", "tema": "P1", "t": "Práctica 1 · Normas", "dif": "M", "tipo": "NOR", "q": "Dos del grupo cambian el mi const root = document.documentElement;
try { const t = localStorage.getItem('tema'); if (t) root.dataset.theme = t; } catch(e) {}
document.getElementById('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('tema', root.dataset.theme); } catch(e) {}
};

/* ---------- zoom de esquemas ---------- */
const zoom = document.getElementById('zoom');
zoom.onclick = () => zoom.style.display = 'none';
function openZoom(src){ zoom.querySelector('img').src = src; zoom.style.display = 'flex'; }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (zoom.style.display === 'flex') { zoom.style.display = 'none'; return; }
    location.href = 'index.html#tests'; return;
  }
  if (e.key === 'Backspace' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    location.href = 'index.html#tests'; return;
  }
  if (state.screen !== 'q') return;
  if (e.key === 'ArrowLeft') { go(state.i - 1); e.preventDefault(); return; }
  if (e.key === 'ArrowRight') { go(state.i + 1); e.preventDefault(); return; }
  if (e.key === 'PageDown') { go(Math.min(state.list.length - 1, state.i + 10)); e.preventDefault(); return; }
  if (e.key === 'PageUp') { go(Math.max(0, state.i - 10)); e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  const idx = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (!state.answered && idx >= 0) { answer(idx); e.preventDefault(); }
  else if (state.answered && (e.key === 'Enter' || e.key === ' ')) { next(); e.preventDefault(); }
});

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pts = s => esc(s).replace(/[\u24B6-\u24CF]/g, c => `<b class="pt">${String.fromCharCode(c.charCodeAt(0) - 0x24B6 + 65)}</b>`);

let state = { screen: 'start' };

/* ---------- inicio ---------- */
function start(){
  state = { screen: 'start' }; drawMap();
  const cnt = t => DATA.filter(q => q.tema === t).length;
  const N = DATA.length, B = 25, blocks = [];
  for (let a = 1; a <= N; a += B) blocks.push([a, Math.min(a + B - 1, N)]);
  let mode = 'orden';
  try { mode = localStorage.getItem('testModoHA') || 'orden'; } catch(e) {}
  app.innerHTML = `
  <h1>Test del Tema 1 · <span>Home Assistant</span></h1>
  <p class="sub">${N} preguntas de Home Assistant y MQTT: la teoría, nuestro servidor de prácticas con sus dispositivos virtuales y la Práctica 1 (el dashboard del tiempo).</p>
  <div class="card">
    <fieldset><legend>¿Cómo quieres hacerlo?</legend><div class="chips">
      <label class="chip"><input type="radio" name="modo" value="orden" ${mode==='orden'?'checked':''}><span>En orden</span></label>
      <label class="chip"><input type="radio" name="modo" value="azar" ${mode==='azar'?'checked':''}><span>Al azar</span></label>
      <label class="chip"><input type="radio" name="modo" value="cat" ${mode==='cat'?'checked':''}><span>Por tema</span></label>
    </div></fieldset>
    <div id="m-orden">
      <fieldset><legend>Qué preguntas</legend><div class="chips">
        ${blocks.map(([a,b],i) => `<label class="chip"><input type="radio" name="bloque" value="${a}-${b}" ${i===0?'checked':''}><span>${a} a ${b}</span></label>`).join('')}
        <label class="chip"><input type="radio" name="bloque" value="1-${N}"><span>Todas (1 a ${N})</span></label>
      </div></fieldset>
    </div>
    <div id="m-azar">
      <fieldset><legend>De dónde sale</legend><div class="chips">
        ${Object.keys(TEMAS).filter(t => cnt(t) > 0).map(t => `<label class="chip"><input type="checkbox" name="tema" value="${t}" checked><span>${TEMAS[t]} <span class="cnt">(${cnt(t)})</span></span></label>`).join('')}
      </div></fieldset>
      <fieldset><legend>Tipo de pregunta</legend><div class="chips">
        ${Object.keys(TIPO).filter(t => DATA.some(q => q.tipo === t)).map(t => `<label class="chip"><input type="checkbox" name="tipo" value="${t}" checked><span>${TIPO[t]} <span class="cnt">(${DATA.filter(q => q.tipo === t).length})</span></span></label>`).join('')}
      </div></fieldset>
      <fieldset><legend>Dificultad</legend><div class="chips">
        <label class="chip"><input type="radio" name="dif" value="all" checked><span>Todas</span></label>
        <label class="chip"><input type="radio" name="dif" value="M"><span>Medias</span></label>
        <label class="chip"><input type="radio" name="dif" value="D"><span>Difíciles</span></label>
      </div></fieldset>
      <fieldset><legend>Número de preguntas</legend><div class="chips">
        ${[10,20,40].map((n,i) => `<label class="chip"><input type="radio" name="num" value="${n}" ${i===1?'checked':''}><span>${n}</span></label>`).join('')}
        <label class="chip"><input type="radio" name="num" value="0"><span>Todas</span></label>
      </div></fieldset>
    </div>
    <div id="m-cat">
      <p class="cnt" style="margin:0 0 8px">Elige uno o varios temas: saldrán preguntas al azar solo de lo que marques.</p>
      <div class="cbtns"><button type="button" id="call">Marcar todos</button><button type="button" id="cnone">Quitar todos</button></div>
      ${CATS.map(([g, items]) => `<div class="cgrp"><h3>${g}</h3><div class="chips">
        ${items.filter(([k]) => DATA.some(q => q.cat.includes(k))).map(([k, l]) => `<label class="chip"><input type="checkbox" name="cat" value="${k}"><span>${l} <span class="cnt">(${DATA.filter(q => q.cat.includes(k)).length})</span></span></label>`).join('')}
      </div></div>`).join('')}
      <fieldset><legend>Número de preguntas</legend><div class="chips">
        ${[10,20].map((n,i) => `<label class="chip"><input type="radio" name="numc" value="${n}" ${i===0?'checked':''}><span>${n}</span></label>`).join('')}

    <b>En orden</b>: las preguntas salen siempre con el mismo número y las respuestas en el mismo orden, como en el test en papel.
    <b>Al azar</b>: cambian las preguntas y el orden de las respuestas cada vez.
    <b>Por tema</b>: practica solo lo que quieras (por ejemplo, los temas de MQTT o las automatizaciones).</div>`;
  const upd = () => {
    const m = app.querySelector('input[name=modo]:checked').value;
    document.getElementById('m-orden').style.display = m === 'orden' ? '' : 'none';
    document.getElementById('m-azar').style.display = m === 'azar' ? '' : 'none';
    document.getElementById('m-cat').style.display = m === 'cat' ? '' : 'none';
    try { localStorage.setItem('testModoHA', m); } catch(e) {}
    const pool = pick();
    document.getElementById('avail').textContent = m === 'orden'
      ? `${pool.length} preguntas, de la ${pool[0].n} a la ${pool[pool.length-1].n}.`
      : m === 'cat'
      ? (catPool().length ? `Hay ${catPool().length} preguntas de estos temas; te saldrán ${pool.length}.` : 'Marca al menos un tema.')
      : `Hay ${filtered().length} preguntas con estos filtros.`;
    document.getElementById('go').disabled = pool.length === 0;
  };
  app.querySelectorAll('input').forEach(i => i.onchange = upd);
  document.getElementById('call').onclick = () => { app.querySelectorAll('input[name=cat]').forEach(i => i.checked = true); upd(); };
  document.getElementById('cnone').onclick = () => { app.querySelectorAll('input[name=cat]').forEach(i => i.checked = false); upd(); };
  upd();
  offerProg();
  document.getElementById('go').onclick = () => {
    const pool = pick(), ord = state.mode === 'orden';
    state = { screen: 'q', mode: ord ? 'orden' : 'azar', list: pool.map(q => item(q, ord)), i: 0, ok: 0, answered: false };
    show();
  };
}
function item(q, ord){ return { q, order: ord ? fixedOrder(q) : shuffle([0,1,2,3]), pick: null }; }
function fixedOrder(q){ const a = 'abcd'.indexOf(q.ans); let d = 1; return [0,1,2,3].map(k => k === a ? 0 : d++); }
function pick(){
  const m = app.querySelector('input[name=modo]:checked').value;
  state.mode = m;
  if (m === 'orden') {
    const [a, b] = app.querySelector('input[name=bloque]:checked').value.split('-').map(Number);
    return DATA.filter(q => q.n >= a && q.n <= b);
  }
  if (m === 'cat') {
    const nc = +app.querySelector('input[name=numc]:checked').value, pc = shuffle(catPool());
    return nc ? pc.slice(0, nc) : pc;
  }
  const n = +app.querySelector('input[name=num]:checked').value;
  let pool = shuffle(filtered());
  return n ? pool.slice(0, n) : pool;
}
function catPool(){
  const cs = [...app.querySelectorAll('input[name=cat]:checked')].map(i => i.value);
  return DATA.filter(q => q.cat.some(c => cs.includes(c)));
}
function filtered(){
  const temas = [...app.querySelectorAll('input[name=tema]:checked')].map(i => i.value);
  const dif = app.querySelector('input[name=dif]:checked').value;
  const tipos = [...app.querySelectorAll('input[name=tipo]:checked')].map(i => i.value);
  return DATA.filter(q => temas.includes(q.tema) && tipos.includes(q.tipo) && (dif === 'all' || q.dif === dif));
}

/* ---------- test a medias: se guarda en este navegador para seguirlo otro día ---------- */
const PKEY = 'testProg:' + (location.pathname.split('/').pop() || 'test');
function saveProg(){
  try {
    if (state.screen !== 'q' || !state.list.some(x => x.pick !== null)) return;
    localStorage.setItem(PKEY, JSON.stringify({ v: 1, t: Date.now(), mode: state.mode, i: state.i, list: state.list.map(x => [x.q.n, x.order, x.pick]) }));
  } catch(e) {}
}
function clearProg(){ try { localStorage.removeItem(PKEY); } catch(e) {} }
function loadProg(){
  try {
    const p = JSON.parse(localStorage.getItem(PKEY) || 'null');
    if (!p || p.v !== 1 || !Array.isArray(p.list) || !p.list.length) return null;
    const byn = {}; DATA.forEach(q => byn[q.n] = q);
    const list = p.list.map(a => {
      const q = byn[a[0]], o = a[1], k = a[2];
      if (!q || !Array.isArray(o) || o.slice().sort().join('') !== '0123') return null;
      return { q, order: o, pick: (k === 0 || k === 1 || k === 2 || k === 3) ? k : null };
    });
    if (list.some(x => !x)) return null;
    const done = list.filter(x => x.pick !== null).length;
    if (!done || done === list.length) return null;
    return { mode: p.mode === 'orden' ? 'orden' : 'azar', list, done, i: Math.max(0, Math.min(list.length - 1, p.i | 0)),
             ok: list.filter(x => x.pick !== null && x.order[x.pick] === 0).length };
  } catch(e) { return null; }
}
function offerProg(){
  const p = loadProg(); if (!p) return;
  const d = document.createElement('div'); d.className = 'card resume'; d.id = 'resume';
  d.innerHTML = `<b>Tienes un test a medias.</b> Llevas ${p.done} de ${p.list.length} preguntas contestadas y ${p.ok} ${p.ok === 1 ? 'acierto' : 'aciertos'}.
    <div class="nav" style="justify-content:flex-start;margin-top:10px"><button class="go" id="cont">Seguir donde lo dejé</button><button class="go ghost" id="drop">Borrarlo</button></div>`;
  app.insertBefore(d, app.querySelector('.card'));
  document.getElementById('cont').onclick = () => {
    const first = p.list.findIndex(x => x.pick === null);
    state = { screen: 'q', mode: p.mode, list: p.list, i: first >= 0 ? first : p.i, ok: p.ok, answered: false };
    show();
  };
  document.getElementById('drop').onclick = () => { clearProg(); d.remove(); };
}

/* ---------- pregunta ---------- */
function opts(q){ return [q.ok, ...q.d]; } // índice 0 = correcta
function show(){
  const it = state.list[state.i], q = it.q, n = state.list.length;
  state.answered = it.pick !== null;
  const all = opts(q);
  app.innerHTML = `
  <div class="meta"><span class="tag nq">Nº ${q.n}</span><span>${state.i+1} de ${n}</span>
    <span class="tag">${TEMAS[q.tema]}</span><span class="tag">${TIPO[q.tipo]}</span>
    <span class="tag ${q.dif==='D'?'d':''}">${q.dif==='D'?'Difícil':'Media'}</span>
    <span class="score">Aciertos: ${state.ok}</span></div>
  <div class="bar"><i style="width:${state.list.filter(x => x.pick !== null).length/n*100}%"></i></div>
  <div class="jump">
    <button class="go ghost" id="prev" ${state.i === 0 ? 'disabled' : ''} aria-label="Pregunta anterior">←<span class="tx"> Anterior</span></button>
    <button class="go ghost" id="m10" ${state.i === 0 ? 'disabled' : ''} aria-label="Retroceder 10 preguntas">−10</button>
    <button class="go ghost" id="tg" aria-expanded="false" aria-controls="qg">Ir a la pregunta… ▾</button>
    <button class="go ghost" id="p10" ${state.i === n - 1 ? 'disabled' : ''} aria-label="Avanzar 10 preguntas">+10</button>
    <button class="go ghost" id="nx" ${state.i === n - 1 ? 'disabled' : ''} aria-label="Pregunta siguiente"><span class="tx">Siguiente </span>→</button>
    <div class="qgrid" id="qg" hidden>
      ${state.list.map((x,k) => `<button data-j="${k}" class="${x.pick === null ? '' : (x.order[x.pick] === 0 ? 'ok' : 'ko')}${k === state.i ? ' cur' : ''}">${lab(x,k)}</button>`).join('')}
      <p class="leg">Verde: acertada · Rojo: fallada · Gris: sin contestar. Con el teclado: flechas ← → (de una en una) y AvPág / RePág (de 10 en 10).</p>
      <button class="go fin" id="fin">Terminar y ver resultado</button>
    </div>
  </div>
  <div class="card">
    ${q.img ? `<figure><img src="${IMGS[q.img]}" alt="Figura: ${esc(q.cap)}" id="fig"><figcaption>${esc(q.cap)}</figcaption></figure>` : ''}
    <div class="qtext">${pts(q.q)}</div>
    ${q.tab ? tabla(q.tab) : ''}
    <div class="opts">${it.order.map((o,k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${pts(all[o])}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
  const f = document.getElementById('fig'); if (f) f.onclick = () => openZoom(f.src);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  document.getElementById('prev').onclick = () => go(state.i - 1);
  document.getElementById('nx').onclick = () => go(state.i + 1);
  document.getElementById('m10').onclick = () => go(Math.max(0, state.i - 10));
  document.getElementById('p10').onclick = () => go(Math.min(state.list.length - 1, state.i + 10));
  document.getElementById('fin').onclick = result;
  const tg = document.getElementById('tg'), qg = document.getElementById('qg');
  tg.onclick = () => { qg.hidden = !qg.hidden; tg.setAttribute('aria-expanded', !qg.hidden); };
  app.querySelectorAll('.qgrid button[data-j]').forEach(b => b.onclick = () => go(+b.dataset.j));
  if (state.answered) paint();
  drawMap();
  window.scrollTo({ top: 0 });
}
function tabla(t){
  return `<div class="tw"><table class="tt"><thead><tr>${t.h.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.r.map(r => `<tr>${r.map(c => c === '?' ? '<td class="qq">?</td>' : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="hint" style="margin-top:0">1 = sí (cerrado, pulsado, activado, encendido) · 0 = no.</p>`;
}
function answer(k){
  if (state.answered) return;
  const it = state.list[state.i];
  it.pick = k; state.answered = true;
  if (it.order[k] === 0) state.ok++;
  paint(); saveProg();
  const nb = document.getElementById('next'); if (nb) nb.focus({ preventScroll: true });
}
function paint(){
  const it = state.list[state.i], q = it.q;
  const good = it.order[it.pick] === 0;
  app.querySelectorAll('.opt').forEach(b => {
    const k = +b.dataset.k; b.disabled = true;
    if (it.order[k] === 0) b.classList.add('right');
    else if (k === it.pick) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const okLetter = 'ABCD'[it.order.indexOf(0)];
  const last = state.i === state.list.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="verdict ${good?'ok':'ko'}">${good ? '✔ ¡Correcto!' : `✘ No es correcta. La buena es la opción ${okLetter}.`}</div>
    <div class="box why"><span class="lbl">¿POR QUÉ?</span>${pts(q.j)}</div>
    <div class="hint">Lo tienes en: ${esc(q.t)}</div>
    <div class="nav"><button class="go" id="next">${last ? 'Ver resultado' : 'Siguiente →'}</button></div>`;
  document.getElementById('next').onclick = next;
  document.querySelector('.score').textContent = `Aciertos: ${state.ok}`;
  drawMap();
}
function lab(x, k){ return state.mode === 'orden' ? x.q.n : k + 1; }
function go(k){ if (k < 0 || k >= state.list.length) return; state.i = k; show(); saveProg(); }
function next(){
  if (state.i < state.list.length - 1) { state.i++; show(); saveProg(); } else result();
}

/* ---------- resultado ---------- */
function result(){
  state.screen = 'end'; drawMap();
  if (state.list.every(it => it.pick !== null)) clearProg();
  const n = state.list.length, ans = state.list.filter(it => it.pick !== null), blank = state.list.filter(it => it.pick === null);
  const nota = ans.length ? state.ok / ans.length * 10 : 0;
  const fails = ans.filter(it => it.order[it.pick] !== 0);
  const msg = nota >= 9 ? '¡Muy bien! Lo dominas.' : nota >= 7 ? 'Bien. Repasa los fallos.' : nota >= 5 ? 'Aprobado justo: repasa los fallos con los apuntes.' : 'Toca repasar. Mira los fallos y vuelve a intentarlo.';
  app.innerHTML = `
  <h1>Resultado</h1>
  <div class="card" style="text-align:center">
    <p class="big">${state.ok} / ${ans.length}</p>
    <p style="margin:4px 0 0">Nota: <b>${nota.toFixed(1).replace('.',',')}</b> · ${msg}</p>
    ${blank.length ? `<p class="cnt" style="margin:6px 0 0">Has contestado ${ans.length} de ${n}. Las ${blank.length} sin contestar no cuentan en la nota.</p>` : ''}
  </div>
  ${fails.length ? `<div class="card"><h2 style="margin:0 0 4px;font-size:20px">Tus fallos (${fails.length})</h2>
    ${fails.map(it => { const a = opts(it.q); return `<div class="review">
      <div class="rq">Nº ${it.q.n}. ${pts(it.q.q)}${it.q.img ? ` <span class="cnt">(${esc(it.q.cap.split('. ')[0])})</span>` : ''}</div>
      <div class="ry">Tu respuesta: ${pts(a[it.order[it.pick]])}</div>
      <div class="ra">Correcta: ${pts(a[0])}</div>
      <div class="cnt">${pts(it.q.j)} · ${esc(it.q.t)}</div></div>`; }).join('')}
  </div>` : ''}
  <div class="nav" style="justify-content:center">
    ${fails.length ? '<button class="go ghost" id="redo">Repetir solo los fallos</button>' : ''}
    ${blank.length ? '<button class="go ghost" id="blank">Hacer las que faltan</button>' : ''}
    <button class="go" id="again">Nuevo test</button>
  </div>`;
  document.getElementById('again').onclick = start;
  const r = document.getElementById('redo');
  if (r) r.onclick = () => { state = { screen: 'q', mode: state.mode, list: (state.mode === 'orden' ? fails : shuffle(fails)).map(it => item(it.q, state.mode === 'orden')), i: 0, ok: 0, answered: false }; show(); };
  const bl = document.getElementById('blank');
  if (bl) bl.onclick = () => { const m = state.mode; state = { screen: 'q', mode: m, list: blank.map(it => item(it.q, m === 'orden')), i: 0, ok: 0, answered: false }; show(); };
  window.scrollTo({ top: 0 });
}

/* ---------- mapa de preguntas y marcador (a los lados; en el móvil, barra de abajo) ---------- */
const mapL = document.createElement('aside'), mapR = document.createElement('aside'), qbar = document.createElement('div'), qsheet = document.createElement('div');
mapL.className = 'qmap l'; mapR.className = 'qmap r'; qbar.className = 'qbar'; qsheet.className = 'qsheet'; qsheet.hidden = true;
mapL.setAttribute('aria-label', 'Mapa de preguntas'); mapR.setAttribute('aria-label', 'Cómo vas');
document.body.append(mapL, mapR, qsheet, qbar);
qbar.onclick = () => { qsheet.hidden = !qsheet.hidden; };
function qcls(x, k){ return (x.pick === null ? '' : (x.order[x.pick] === 0 ? 'ok' : 'ko')) + (k === state.i ? ' cur' : ''); }
function gridHTML(){
  const L = state.list; let h = '';
  for (let a = 0; a < L.length; a += 10) {
    const b = Math.min(a + 9, L.length - 1);
    h += `<div class="qblk"><span>${lab(L[a], a)} a ${lab(L[b], b)}</span><div class="g">` + L.slice(a, a + 10).map((x, j) => `<button data-j="${a + j}" class="${qcls(x, a + j)}" aria-label="Pregunta ${lab(x, a + j)}">${lab(x, a + j)}</button>`).join('') + '</div></div>';
  }
  return h;
}
function drawMap(){
  const on = state.screen === 'q'; document.body.classList.toggle('inq', on);
  if (!on) { qsheet.hidden = true; return; }
  const L = state.list, n = L.length, ans = L.filter(x => x.pick !== null), ok = ans.filter(x => x.order[x.pick] === 0).length, ko = ans.length - ok;
  const nota = ans.length ? (ok / ans.length * 10).toFixed(1).replace('.', ',') : '–';
  mapL.innerHTML = '<h2>Preguntas</h2>' + gridHTML() + '<p class="leg"><i class="ok"></i>acertada <i class="ko"></i>fallada <i></i>sin contestar</p>';
  mapR.innerHTML = `<h2>Cómo vas</h2><div class="sc ok"><b>${ok}</b>aciertos</div><div class="sc ko"><b>${ko}</b>fallos</div><div class="sc"><b>${n - ans.length}</b>sin contestar</div><div class="sc nota">Nota: <b>${nota}</b><small>solo cuenta lo contestado</small></div><button class="go fin" id="finR">Terminar y ver resultado</button>`;
  qbar.innerHTML = `<div class="segs">${L.map((x, k) => `<i class="${qcls(x, k)}"></i>`).join('')}</div><div class="tx">${state.i + 1} de ${n} · <span class="ok">✔ ${ok}</span> · <span class="ko">✘ ${ko}</span><span class="more">▴ mapa de preguntas</span></div>`;
  qsheet.innerHTML = gridHTML() + '<button class="go fin" id="finS">Terminar y ver resultado</button>';
  mapL.querySelectorAll('button[data-j]').forEach(b => b.onclick = () => go(+b.dataset.j));
  qsheet.querySelectorAll('button[data-j]').forEach(b => b.onclick = () => { qsheet.hidden = true; go(+b.dataset.j); });
  document.getElementById('finR').onclick = result;
  document.getElementById('finS').onclick = () => { qsheet.hidden = true; result(); };
  const c = mapL.querySelector('.cur'); if (c && c.scrollIntoView) c.scrollIntoView({ block: 'nearest' });
}
start();
</script>
</body>
